name: Verify
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: docker build -t restock-alerts .
      - name: Smoke-test Docker on a custom PORT
        run: |
          docker run -d --name restock-ci -p 8080:8080 -e PORT=8080 -e STOCK_API_URL=https://stock.invalid -e STOCK_API_KEY=test -e RESEND_BASE_URL=https://mail.invalid -e RESEND_API_KEY=test -e WEBHOOK_SECRET=test restock-alerts
          curl --retry 10 --retry-delay 1 --retry-all-errors --fail http://localhost:8080/healthz || { docker logs restock-ci; exit 1; }
          docker restart restock-ci
          curl --retry 10 --retry-delay 1 --retry-all-errors --fail http://localhost:8080/healthz || { docker logs restock-ci; exit 1; }
          docker rm -f restock-ci
